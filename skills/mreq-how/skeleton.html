<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

     Its sha256 is in script-src: an edit to the script needs a new hash (tests/test_how_page.py checks it). -->

<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #fbfaf7;
    --surface: #ffffff;
    --ink: #1f2328;
    --muted: #5b6470;
    --line: #e2dfd8;
    --accent: #2f5bd3;
    --accent-soft: #e9effd;
    --warn: #8a5300;
    --warn-soft: #fdf4e3;
    --open: #63389a;
    --open-soft: #f3edfb;
    --note: #1f6f4a;
    --note-soft: #e9f6ef;
    --sans: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei UI", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.75 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body.dg-lock { overflow: hidden; }

  .masthead { border-bottom: 1px solid var(--line); background: var(--surface); }
  .masthead-inner { max-width: 74rem; margin: 0 auto; padding: 2.5rem 2rem 2rem; }
  h1 { margin: 0 0 0.4rem; font-size: 2rem; line-height: 1.3; letter-spacing: -0.01em; }
  .question { margin: 0; color: var(--muted); font-size: 1.05rem; }
  .question::before { content: "\201C"; }
  .question::after { content: "\201D"; }
  .meta { margin: 0.9rem 0 0; color: var(--muted); font-size: 0.85rem; }

  .layout { display: grid; grid-template-columns: 14rem minmax(0, 1fr); gap: 3rem; max-width: 74rem; margin: 0 auto; padding: 2rem; }
  .toc { position: sticky; top: 1.5rem; align-self: start; max-height: calc(100vh - 3rem); overflow: auto; font-size: 0.9rem; }
  .toc-title { margin: 0 0 0.5rem; color: var(--muted); font: 600 0.78rem/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; }
  .toc ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
  .toc a { display: block; padding: 0.3rem 0 0.3rem 0.9rem; margin-left: -2px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; line-height: 1.45; }
  .toc a:hover { color: var(--ink); }
  .toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

  main { min-width: 0; max-width: 50rem; }
  section { margin: 0 0 3.5rem; scroll-margin-top: 1.5rem; }
  h2 { margin: 0 0 1rem; font-size: 1.45rem; line-height: 1.35; padding-bottom: 0.4rem; border-bottom: 1px solid var(--line); }
  h3 { margin: 2rem 0 0.6rem; font-size: 1.12rem; line-height: 1.4; }
  p { margin: 0 0 1rem; }
  .lede { font-size: 1.12rem; }
  a { color: var(--accent); }
  strong { font-weight: 650; }
  ul, ol { padding-left: 1.4rem; margin: 0 0 1rem; }
  li { margin: 0.25rem 0; }

  code { font: 0.86em/1.5 var(--mono); background: #f1efea; border-radius: 4px; padding: 0.1em 0.35em; }
  code.ref { cursor: copy; color: var(--accent); background: var(--accent-soft); }
  code.ref.copied { color: var(--note); background: var(--note-soft); }
  pre { margin: 0 0 1.2rem; padding: 1rem 1.2rem; overflow: auto; background: #f6f5f1; border: 1px solid var(--line); border-radius: 8px; }
  pre code { background: none; padding: 0; font-size: 0.85rem; }

  .concepts { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 0.9rem; margin: 0 0 1.2rem; }
  .concepts > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem 1rem; }
  .concepts dt { font-weight: 650; margin: 0 0 0.3rem; }
  .concepts dt code { font-size: 0.78em; margin-left: 0.3rem; }
  .concepts dd { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.6; }

  ol.steps { counter-reset: step; list-style: none; padding: 0; }
  ol.steps > li { counter-increment: step; position: relative; padding: 0 0 1.1rem 2.6rem; margin: 0; }
  ol.steps > li::before { content: counter(step); position: absolute; left: 0; top: 0.1rem; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 700 0.85rem/1.7rem var(--sans); text-align: center; }
  ol.steps > li:not(:last-child)::after { content: ""; position: absolute; left: 0.83rem; top: 2rem; bottom: 0.2rem; width: 2px; background: var(--line); }

  table { width: 100%; border-collapse: collapse; margin: 0 0 1.2rem; font-size: 0.95rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; vertical-align: top; padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--line); }
  th { background: #f6f5f1; font-weight: 650; }
  tr:last-child td { border-bottom: none; }
  td:first-child { white-space: nowrap; }

  .callout { margin: 0 0 1rem; padding: 0.9rem 1.1rem; border-radius: 8px; border-left: 4px solid; }
  .callout > :last-child { margin-bottom: 0; }
  .callout > strong:first-child { display: block; margin-bottom: 0.25rem; }
  .callout.warn { background: var(--warn-soft); border-color: var(--warn); }
  .callout.warn > strong:first-child { color: var(--warn); }
  .callout.open { background: var(--open-soft); border-color: var(--open); }
  .callout.open > strong:first-child { color: var(--open); }
  .callout.note { background: var(--note-soft); border-color: var(--note); }
  .callout.note > strong:first-child { color: var(--note); }

  details { margin: 0 0 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  summary { cursor: pointer; padding: 0.7rem 1rem; font-weight: 600; }
  details > :not(summary) { margin-left: 1rem; margin-right: 1rem; }
  details[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 0.8rem; }

  figure.diagram { margin: 1.4rem 0 1.8rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  figure.diagram:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dg-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--line); background: #f8f7f3; font-size: 0.85rem; }
  .dg-bar .dg-count { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5rem; text-align: center; }
  .dg-bar .dg-spacer { flex: 1; }
  .dg-bar button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0.25rem 0.7rem; cursor: pointer; }
  .dg-bar button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .dg-bar button:disabled { opacity: 0.4; cursor: default; }
  .dg-bar button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .dg-canvas { overflow: auto; padding: 0.8rem; text-align: center; }
  .dg-canvas svg { max-width: 100%; height: auto; }
  .dg-panel { min-height: 3.2rem; padding: 0.7rem 1rem; border-top: 1px solid var(--line); background: #fcfbf9; font-size: 0.93rem; line-height: 1.6; }
  .dg-panel .dg-hint { color: var(--muted); }
  .dg-panel strong { display: block; }
  .dg-panel p { margin: 0.2rem 0 0; }
  figcaption { padding: 0.6rem 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.88rem; }
  .dg-error { margin: 0.8rem; padding: 0.8rem 1rem; border-radius: 8px; background: #fdecec; color: #8f1d1d; font: 0.85rem/1.6 var(--mono); white-space: pre-wrap; text-align: left; }

  figure.diagram.expanded { position: fixed; inset: 3vh 3vw; z-index: 50; margin: 0; display: flex; flex-direction: column; box-shadow: 0 0 0 100vmax rgba(31, 35, 40, 0.45), 0 20px 50px rgba(0, 0, 0, 0.25); }
  figure.diagram.expanded .dg-canvas { flex: 1; }
  figure.diagram.expanded .dg-canvas svg { max-width: none; width: calc(var(--w, 800px) * 1.35); }

  /* Diagram elements: shared by generated and hand-written SVG. */
  .dg text { font-family: var(--sans); font-size: 13px; fill: var(--ink); }
  .dg .node { cursor: pointer; }
  .dg .node rect, .dg .node path, .dg .node circle, .dg .node ellipse { fill: #ffffff; stroke: #3d4a5c; stroke-width: 1.4; }
  .dg .node.k-store rect, .dg .node.k-store path, .dg .node.k-store ellipse { fill: #f3f7ec; stroke: #56762a; }
  .dg .node.k-external rect { fill: #f7f7f5; stroke: #8a919b; stroke-dasharray: 5 4; }
  .dg .node.k-actor rect { fill: #f4effc; stroke: #6a4a9c; }
  .dg .node.k-decision path { fill: #fff7e5; stroke: #a3741b; }
  .dg .node.k-state rect { fill: #eef3ff; stroke: #2f5bd3; }
  .dg .node.k-start circle { fill: #1f2328; stroke: #1f2328; }
  .dg .node.k-end circle { fill: #ffffff; stroke: #1f2328; stroke-width: 2; }
  .dg .node.k-end circle.dot { fill: #1f2328; }
  .dg .node:hover rect, .dg .node:hover path, .dg .node:hover ellipse { stroke: var(--accent); }
  .dg .group rect { fill: #f7f6f2; stroke: #d6d2c8; stroke-dasharray: 6 4; }
  .dg .group text { fill: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
  .dg .edge { cursor: pointer; }
  .dg .edge path.line { fill: none; stroke: #6b7380; stroke-width: 1.5; }
  .dg .edge.dashed path.line { stroke-dasharray: 6 4; }
  .dg .edge path.hit { fill: none; stroke: transparent; stroke-width: 14; }
  .dg .edge:hover path.line { stroke: var(--accent); }
  .dg .label rect { fill: #ffffff; opacity: 0.94; }
  .dg .label text { font-size: 12px; fill: #3d4550; }
  .dg .lifeline { stroke: #b9b5ac; stroke-dasharray: 4 4; }
  .dg .divider rect { fill: #f1efe9; }
  .dg .divider text { font-size: 12px; font-weight: 600; fill: var(--muted); }
  .dg [data-key] { transition: opacity 0.2s; }
  .dg.stepping [data-key]:not(.on) { opacity: 0.18; }
  .dg .on path.line { stroke: var(--accent); stroke-width: 2.4; }
  .dg .node.on rect, .dg .node.on path, .dg .node.on ellipse { stroke: var(--accent); stroke-width: 2.4; }
  .dg .picked rect, .dg .picked path, .dg .picked ellipse, .dg .picked path.line { stroke: var(--accent); stroke-width: 2.4; }

  @media (max-width: 960px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 1rem; padding: 1.2rem; }
    .toc { position: static; max-height: none; padding: 0.8rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    .masthead-inner { padding: 1.8rem 1.2rem 1.4rem; }
    h1 { font-size: 1.6rem; }
  }
  @media print {
    .toc, .dg-bar { display: none; }
    .layout { display: block; }
    figure.diagram, .callout, details { break-inside: avoid; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <h1>{{TITLE}}</h1>
    <p class="question">{{QUESTION}}</p>
    <p class="meta">{{META}}</p>
  </div>
</header>
<div class="layout">
  <nav class="toc" aria-label="Contents"></nav>
  <main>
<!-- CONTENT -->
  </main>
</div>

      return true;
    }
    for (var a = 0; a < ts.length; a++) {
      var q = pointAt(r, ts[a]);
      for (var b = 0; b < shifts.length; b++) {
        var x = inside(q.x + nx * shifts[b], size.w / 2, W);
        var y = inside(q.y + ny * shifts[b], size.h / 2, H);
        if (free(x, y)) return { x: x, y: y };
      }
    }
    var mid = pointAt(r, 0.5);
    return { x: inside(mid.x, size.w / 2, W), y: inside(mid.y, size.h / 2, H) };
  }
  function crosses(r, geos, a, b) {
    for (var i = 1; i < 30; i++) {
      var q = pointAt(r, i / 30);
      for (var j = 0; j < geos.length; j++) {
        var g = geos[j];
        if (g === a || g === b) continue;
        if (Math.abs(q.x - g.cx) < g.hw + 6 && Math.abs(q.y - g.cy) < g.hh + 6) return true;
      }
    }
    return false;
  }

  // Maps without a prototype: an id such as "constructor" must not find a built-in.
  function validateFlow(spec) {
    var errors = [];
    var ids = Object.create(null);
    var cells = Object.create(null);
    (spec.nodes || []).forEach(function (n, i) {
      if (!n.id) errors.push('nodes[' + i + ']: missing "id"');
      if (ids[n.id]) errors.push('node "' + n.id + '" is defined twice');
      ids[n.id] = true;
      // JSON.parse reads 1e400 as Infinity, which draws NaN paths instead of a red box.
      if (!Number.isFinite(n.col) || !Number.isFinite(n.row)) errors.push('node "' + n.id + '": "col" and "row" must be numbers');
      var cell = n.col + ',' + n.row;
      if (cells[cell]) errors.push('nodes "' + cells[cell] + '" and "' + n.id + '" share cell col ' + n.col + ', row ' + n.row);
      cells[cell] = n.id;
    });
    (spec.edges || []).forEach(function (e, i) {
      if (!ids[e.from]) errors.push('edges[' + i + ']: unknown "from" node "' + e.from + '"');
      if (!ids[e.to]) errors.push('edges[' + i + ']: unknown "to" node "' + e.to + '"');
    });
    (spec.steps || []).forEach(function (st, i) {
      (st.show || []).forEach(function (key) {
        var parts = String(key).split('->');
        parts.forEach(function (p) { if (!ids[p]) errors.push('steps[' + i + ']: unknown node "' + p + '" in "' + key + '"'); });
      });
    });
    return errors;
  }

  function renderFlow(spec, info) {
    var geos = (spec.nodes || []).map(geometry);
    var byId = {};
    geos.forEach(function (g) { byId[g.n.id] = g; });
    var cols = 1;
    var rows = 1;
    geos.forEach(function (g) { cols = Math.max(cols, g.n.col + 1); rows = Math.max(rows, g.n.row + 1); });
    (spec.groups || []).forEach(function (gr) { cols = Math.max(cols, gr.cols[1] + 1); rows = Math.max(rows, gr.rows[1] + 1); });
    var W = F.pad * 2 + Math.ceil(cols) * F.colW;
    var H = F.pad * 2 + Math.ceil(rows) * F.rowH;
    var made = newSvg(W, H);
    var svg = made.svg;

    // Group names go into `placed` first, so no edge label covers one. The name
    // is 12px bold with letter spacing: about 7.2 px a unit, from y + 6 to y + 22.
    var placed = [];
    (spec.groups || []).forEach(function (gr) {
      var g = make('g', { 'class': 'group' }, svg);
      var x = F.pad + gr.cols[0] * F.colW + 8;
      var y = F.pad + gr.rows[0] * F.rowH + 4;
      make('rect', { x: x, y: y, width: (gr.cols[1] - gr.cols[0] + 1) * F.colW - 16, height: (gr.rows[1] - gr.rows[0] + 1) * F.rowH - 8, rx: 10 }, g);
      var t = make('text', { x: x + 12, y: y + 18 }, g);
      t.textContent = gr.label || '';
      var nameW = width(t.textContent) * 7.2;
      if (nameW) placed.push({ x: x + 12 + nameW / 2, y: y + 14, w: nameW, h: 16 });
    });

    var edgeLayer = make('g', {}, svg);
    var labels = [];
    var pairs = {};
    (spec.edges || []).forEach(function (e) { pairs[e.from + '->' + e.to] = true; });
    (spec.edges || []).forEach(function (e) {
      var a = byId[e.from];
      var b = byId[e.to];
      var key = 'e:' + e.from + '->' + e.to;
      var g = make('g', { 'class': 'edge' + (e.dashed ? ' dashed' : ''), 'data-key': key }, edgeLayer);
      var r;
      if (a === b) {
        var sx = a.cx + a.hw * 0.35;
        var sy = a.cy - a.hh - 2;
        var ex = a.cx + a.hw + 2;
        var ey = a.cy - a.hh * 0.35;
        r = { d: 'M' + sx + ' ' + sy + ' C' + (sx + 6) + ' ' + (sy - 46) + ' ' + (ex + 46) + ' ' + (ey - 6) + ' ' + ex + ' ' + ey, loop: { x: ex + 30, y: sy - 30 } };
      } else {
        var offset = pairs[e.to + '->' + e.from] ? 7 : 0;
        if (typeof e.bend === 'number') {
          r = route(a, b, e.bend, offset);
        } else {
          // A straight line through another node reads as a connection to it,
          // so bend around anything in the way.
          var tries = [0, 50, -50, 95, -95];
          for (var i = 0; i < tries.length; i++) {
            r = route(a, b, tries[i], offset);
            if (!crosses(r, geos, a, b)) break;
          }
        }
      }
      make('path', { 'class': 'hit', d: r.d }, g);
      var line = make('path', { 'class': 'line', d: r.d, 'marker-end': 'url(#' + made.id + 'a)' }, g);
      line.dataset.marker = made.id;
      if (e.label) labels.push({ route: r, text: e.label, key: key });
      info[key] = { title: e.label || (labelOf(a) + ' → ' + labelOf(b)), text: e.note, ref: e.ref, ends: [e.from, e.to] };
    });

    geos.forEach(function (g) {
      var key = 'n:' + g.n.id;
      var node = make('g', { 'class': 'node k-' + g.kind, 'data-key': key }, svg);
      if (g.kind === 'start') {
        make('circle', { cx: g.cx, cy: g.cy, r: 10 }, node);
      } else if (g.kind === 'end') {
        make('circle', { cx: g.cx, cy: g.cy, r: 11 }, node);
        make('circle', { 'class': 'dot', cx: g.cx, cy: g.cy, r: 6 }, node);
      } else if (g.shape === 'diamond') {
        make('path', { d: 'M' + g.cx + ' ' + (g.cy - g.hh) + ' L' + (g.cx + g.hw) + ' ' + g.cy + ' L' + g.cx + ' ' + (g.cy + g.hh) + ' L' + (g.cx - g.hw) + ' ' + g.cy + ' z' }, node);
      } else if (g.kind === 'store') {
        var top = g.cy - g.hh;
        var bottom = g.cy + g.hh;
        var x0 = g.cx - g.hw;
        var x1 = g.cx + g.hw;
        make('path', { d: 'M' + x0 + ' ' + (top + 7) + ' L' + x0 + ' ' + (bottom - 7) + ' A' + g.hw + ' 7 0 0 0 ' + x1 + ' ' + (bottom - 7) + ' L' + x1 + ' ' + (top + 7) }, node);
        make('ellipse', { cx: g.cx, cy: top + 7, rx: g.hw, ry: 7 }, node);
      } else {
        make('rect', { x: g.cx - g.hw, y: g.cy - g.hh, width: g.hw * 2, height: g.hh * 2, rx: g.kind === 'state' ? 18 : (g.kind === 'actor' ? 24 : 6) }, node);
      }
      if (g.lines.length) textBlock(node, g.lines, g.cx, g.kind === 'store' ? g.cy + 4 : g.cy, F.lineH);
      else if (g.n.label) textBlock(node, wrap(g.n.label, 20), g.cx, g.cy + 26, 15);
      info[key] = { title: labelOf(g), text: g.n.note, ref: g.n.ref };
    });

    // Labels go on top of the nodes, each sharing its edge's key so a step or
    // a click treats the two as one.
    labels.forEach(function (l) {
      var size = labelSize(l.text, 22);
      // A self-loop's label sits above its node, to the right: the last column
      // or the top row would push it off the canvas.
      var loop = l.route.loop;
      var at = loop ? { x: inside(loop.x, size.w / 2, W), y: inside(loop.y, size.h / 2, H) } : labelSpot(l.route, size, geos, placed, W, H);
      placed.push({ x: at.x, y: at.y, w: size.w, h: size.h });
      labelBox(svg, size, at.x, at.y, l.key);
    });

    var steps = (spec.steps || []).map(function (st) {
      var keys = [];
      (st.show || []).forEach(function (k) {
        var parts = String(k).split('->');
        if (parts.length === 2) { keys.push('e:' + k, 'n:' + parts[0], 'n:' + parts[1]); } else keys.push('n:' + k);
      });
      return { title: st.title, text: st.text, keys: keys };
    });
    return { svg: svg, steps: steps };
  }
  function labelOf(g) { return String(g.n && (g.n.label || g.n.id) || '').replace(/\n/g, ' '); }

  // ---- sequence: who calls whom, in order.
  var S = { colW: 184, pad: 24, headW: 152, rowH: 46 };

  function validateSequence(spec) {
    var errors = [];
    var ids = Object.create(null);
    (spec.participants || []).forEach(function (p, i) {
      if (!p.id) errors.push('participants[' + i + ']: missing "id"');
      if (ids[p.id]) errors.push('participant "' + p.id + '" is defined twice');
      ids[p.id] = true;
    });
    (spec.messages || []).forEach(function (m, i) {
      if (m.divider !== undefined) return;
      if (!ids[m.from]) errors.push('messages[' + i + ']: unknown "from" participant "' + m.from + '"');
      if (!ids[m.to]) errors.push('messages[' + i + ']: unknown "to" participant "' + m.to + '"');
    });
    return errors;
  }

  function renderSequence(spec, info) {
    var ps = spec.participants || [];
    var xs = {};
    ps.forEach(function (p, i) { xs[p.id] = S.pad + i * S.colW + S.colW / 2; });
    var heads = ps.map(function (p) { return wrap(p.label || p.id, 19); });
    var headH = Math.max.apply(null, heads.map(function (l) { return l.length * 16 + 20; }).concat([40]));
    var W = S.pad * 2 + Math.max(1, ps.length) * S.colW;

    // Lay rows out first: a wrapped label needs a taller row.
    var y = S.pad + headH + 30;
    var rows = (spec.messages || []).map(function (m) {
      // The next message's label sits above its line, so leave it room below the band.
      if (m.divider !== undefined) { var dy = y - 8; y += 46; return { m: m, y: dy }; }
      var span = m.from === m.to ? 30 : Math.abs(xs[m.to] - xs[m.from]) / 6.6 - 2;
      var lines = m.label ? wrap(m.label, Math.max(14, Math.floor(span))) : [];
      var extra = Math.max(0, lines.length - 1) * 15;
      var row = { m: m, y: y + extra, lines: lines };
      y += S.rowH + extra + (m.from === m.to ? 16 : 0);
      return row;
    });
    var H = y + S.pad;
    var made = newSvg(W, H);
    var svg = made.svg;

    ps.forEach(function (p, i) {
      var key = 'n:' + p.id;
      var x = xs[p.id];
      make('line', { 'class': 'lifeline', x1: x, y1: S.pad + headH, x2: x, y2: H - S.pad }, svg);
      var g = make('g', { 'class': 'node k-' + (p.kind || 'box'), 'data-key': key }, svg);
      make('rect', { x: x - S.headW / 2, y: S.pad, width: S.headW, height: headH, rx: p.kind === 'actor' ? 20 : 6 }, g);
      textBlock(g, heads[i], x, S.pad + headH / 2, 16);
      info[key] = { title: String(p.label || p.id).replace(/\n/g, ' '), text: p.note, ref: p.ref };
    });

    var steps = [];
    rows.forEach(function (row, i) {
      var m = row.m;
      if (m.divider !== undefined) {
        var dg = make('g', { 'class': 'divider' }, svg);
        make('rect', { x: S.pad / 2, y: row.y, width: W - S.pad, height: 24, rx: 4 }, dg);
        var dt = make('text', { x: W / 2, y: row.y + 12, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, dg);
        dt.textContent = m.divider;
        return;
      }
      var key = 'e:m' + i;
      var g = make('g', { 'class': 'edge' + (m.reply ? ' dashed' : ''), 'data-key': key }, svg);
      var x1 = xs[m.from];
      var x2 = xs[m.to];
      var d;
      var lx;
      var anchor = 'middle';
      if (m.from === m.to) {
        d = 'M' + x1 + ' ' + row.y + ' h34 v20 h-32';
        lx = x1 + 42;
        anchor = 'start';
      } else {
        var dir = x2 > x1 ? 1 : -1;
        d = 'M' + (x1 + dir * 2) + ' ' + row.y + ' L' + (x2 - dir * 3) + ' ' + row.y;
        lx = (x1 + x2) / 2;
      }
      make('path', { 'class': 'hit', d: d }, g);
      var line = make('path', { 'class': 'line', d: d, 'marker-end': 'url(#' + made.id + (m.reply ? 'o' : 'a') + ')' }, g);
      line.dataset.marker = made.id;
      if (row.lines.length) {
        var ty = m.from === m.to ? row.y + 10 : row.y - 10 - (row.lines.length - 1) * 15;
        var t = make('text', { x: lx, 'text-anchor': anchor, 'class': 'msg' }, g);
        row.lines.forEach(function (line2, j) {
          var span = make('tspan', { x: lx, y: ty + j * 15 }, t);
          span.textContent = line2;
        });
      }
      info[key] = { title: m.label || (m.from + ' → ' + m.to), text: m.note, ref: m.ref, ends: [m.from, m.to] };
      steps.push({ title: m.label, text: m.note, keys: [key, 'n:' + m.from, 'n:' + m.to] });
    });
    return { svg: svg, steps: spec.steps === false ? [] : steps };
  }

  // ---- figure chrome: toolbar, step-through, detail panel, expand.
  function setupFigure(fig, svg, steps, info) {
    var bar = html('div', 'dg-bar');
    var canvas = html('div', 'dg-canvas');
    var panel = html('div', 'dg-panel');
    panel.setAttribute('aria-live', 'polite');
    var caption = fig.querySelector('figcaption');
    fig.insertBefore(bar, caption);
    fig.insertBefore(canvas, caption);
    fig.insertBefore(panel, caption);
    canvas.appendChild(svg);
    fig.tabIndex = 0;

    var current = -1;
    var prev;
    var next;
    var all;
    var count;
    if (steps.length) {
      prev = html('button', '', bar, '◀ ' + T.prev);
      count = html('span', 'dg-count', bar);
      next = html('button', '', bar, T.next + ' ▶');
      all = html('button', '', bar, T.all);
      prev.type = next.type = all.type = 'button';
      prev.onclick = function () { show(current - 1); };
      next.onclick = function () { show(current + 1); };
      all.onclick = function () { show(-1); };
    }
    html('span', 'dg-spacer', bar);
    var expand = html('button', '', bar, T.expand);
    expand.type = 'button';
    expand.setAttribute('aria-pressed', 'false');
    expand.onclick = function () { setExpanded(!fig.classList.contains('expanded')); };

    function setExpanded(on) {
      fig.classList.toggle('expanded', on);
      document.body.classList.toggle('dg-lock', on);
      expand.textContent = on ? T.close : T.expand;
      expand.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (on) fig.focus();
    }
    function setMarkers(keys) {
      svg.querySelectorAll('path.line').forEach(function (p) {
        var lit = keys && p.parentNode.classList.contains('on');
        // Hand-drawn SVG brings its own markers; a reply keeps its open head.
        var m = p.getAttribute('marker-end') || '';
        if (!p.dataset.marker || /o\)$/.test(m)) return;
        p.setAttribute('marker-end', 'url(#' + p.dataset.marker + (lit ? 'h' : 'a') + ')');
      });
    }
    function highlight(keys) {
      svg.classList.toggle('stepping', !!keys);
      svg.querySelectorAll('[data-key]').forEach(function (el) {
        el.classList.toggle('on', !!keys && keys.indexOf(el.getAttribute('data-key')) !== -1);
      });
      setMarkers(keys);
    }
    function describe(title, text, ref, prefix) {
      panel.textContent = '';
      if (!title && !text) { html('span', 'dg-hint', panel, T.hint); return; }
      var head = html('strong', '', panel, (prefix || '') + (title || ''));
      if (ref) { head.appendChild(document.createTextNode(' ')); html('code', 'ref', head, ref); }
      if (text) html('p', '', panel, text);
    }
    function show(i) {
      svg.querySelectorAll('.picked').forEach(function (el) { el.classList.remove('picked'); });
      if (!steps.length || i < 0 || i >= steps.length) {
        current = -1;
        highlight(null);
        describe();
      } else {
        current = i;
        highlight(steps[i].keys);
        describe(steps[i].title, steps[i].text, null, (i + 1) + '. ');
      }
      if (count) {
        count.textContent = current < 0 ? steps.length + ' ' + (ZH ? '步' : 'steps') : (current + 1) + ' / ' + steps.length;
        prev.disabled = current <= 0;
        next.disabled = current >= steps.length - 1;
        all.disabled = current < 0;
      }
    }

    svg.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-key]');
      if (!el) return;
      var data = info[el.getAttribute('data-key')] || {};
      if (current < 0) {
        svg.querySelectorAll('.picked').forEach(function (p) { p.classList.remove('picked'); });
        el.classList.add('picked');
      }
      describe(data.title || el.getAttribute('data-title'), data.text || el.getAttribute('data-note'), data.ref || el.getAttribute('data-ref'));
    });
    fig.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && fig.classList.contains('expanded')) { setExpanded(false); ev.preventDefault(); }
      if (!steps.length) return;
      if (ev.key === 'ArrowRight') { show(Math.min(current + 1, steps.length - 1)); ev.preventDefault(); }
      if (ev.key === 'ArrowLeft') { show(Math.max(current - 1, 0)); ev.preventDefault(); }
    });
    show(-1);
  }

  function initDiagram(fig) {
    var info = {};
    var specEl = fig.querySelector('script[type="application/json"]');
    var handSvg = fig.querySelector(':scope > svg');
    var result;
    try {
      if (specEl) {
        var spec = JSON.parse(specEl.textContent);
        var errors = spec.type === 'sequence' ? validateSequence(spec) : validateFlow(spec);
        if (errors.length) throw new Error(errors.join('\n'));
        result = spec.type === 'sequence' ? renderSequence(spec, info) : renderFlow(spec, info);
      } else if (handSvg) {
        handSvg.classList.add('dg');
        if (!handSvg.style.getPropertyValue('--w') && handSvg.viewBox && handSvg.viewBox.baseVal) {
          handSvg.style.setProperty('--w', handSvg.viewBox.baseVal.width + 'px');
        }
        result = { svg: handSvg, steps: [] };
      } else {
        return;
      }
    } catch (err) {
      var box = html('div', 'dg-error', null, T.error + ':\n' + err.message);
      fig.insertBefore(box, fig.querySelector('figcaption'));
      if (window.console) console.error('[diagram]', err.message);
      return;
    }
    setupFigure(fig, result.svg, result.steps, info);
  }

  // ---- page: contents, scroll spy, copyable code references.
  function slug(text, i) {
    var s = text.toLowerCase().trim().replace(/[^\wÀ-￿]+/g, '-').replace(/^-+|-+$/g, '');
    return s || 'section-' + (i + 1);
  }
  function buildToc() {
    var toc = document.querySelector('.toc');
    var heads = document.querySelectorAll('main h2');
    if (!toc || !heads.length) { if (toc) toc.remove(); return; }
    html('p', 'toc-title', toc, T.contents);
    var list = html('ol', '', toc);
    var links = [];
    heads.forEach(function (h, i) {
      var target = h.closest('section') || h;
      if (!target.id) target.id = slug(h.textContent, i);
      var li = html('li', '', list);
      var a = html('a', '', li, h.textContent);
      a.href = '#' + target.id;
      links.push({ a: a, target: target });
    });
    if (!('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (l) { l.a.classList.toggle('active', l.target === en.target); });
      });
    }, { rootMargin: '0px 0px -70% 0px' });
    links.forEach(function (l) { io.observe(l.target); });
  }
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    var ta = html('textarea', '', document.body);
    ta.value = text;
    ta.select();
    try { document.execCommand('copy'); } finally { ta.remove(); }
    return Promise.resolve();
  }
  document.addEventListener('click', function (ev) {
    var ref = ev.target.closest('code.ref');
    if (!ref) return;
    copy(ref.textContent).then(function () {
      ref.classList.add('copied');
      ref.title = T.copied;
      setTimeout(function () { ref.classList.remove('copied'); ref.removeAttribute('title'); }, 1200);
    });
  });

  document.querySelectorAll('figure.diagram').forEach(initDiagram);
  buildToc();
})();
</script>
</body>
