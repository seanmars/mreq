<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Offline by construction: nothing outside this file can load, and only the two scripts below run.
     page.py build writes their sha256 hashes into script-src. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src {{CSP}}; img-src data:">
<title>{{TITLE}}</title>
<style>
  /* The page explains part of a codebase: a title and the question, then the sections (WRITING.md), each
     with prose, diagrams and the components below. A contents panel on the left lists the headings
     (h2, and the h3 inside a section) and jumps to each.
     It opens in the light theme; the switch in the top bar turns on the dark theme.
     The chrome holds no colour: ink on a blue-grey ground, white sheets for figures, tables and cards.
     Colour belongs to the diagrams (phase colours and marks), to the callouts, and to one hue, --accent,
     which also draws the "primary" mark and the code references. Surfaces are separated by a 1px edge,
     never by a shadow. Radii: 8px on sheets, 6px on controls and small marks. */
  :root {
    color-scheme: light;
    --bg: #f2f4f7;
    --surface: #ffffff;
    --surface-alt: #eceff3;
    --ink: #111418;
    --muted: #565d68;
    --hairline: #e4e7ec;
    --border: #d3d8df;
    --accent: #1d5fbf;
    --accent-soft: #e6eefa;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei UI", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --bar-height: 52px;

    /* Callouts: warn (a gotcha), open (an open question), note (a side note). */
    --warn: #9a4a06;
    --warn-line: #d9730d;
    --warn-soft: #fff6ea;
    --open: #5b3fa8;
    --open-line: #7b5fd0;
    --open-soft: #f4f0fc;
    --note: #1e6a2f;
    --note-line: #2e8540;
    --note-soft: #edf7ef;

    /* Diagram colours. --pele-bg is the sheet under the diagram: edge labels take it, so they sit on the sheet.
       --pele-surface fills a plain node, one step off the sheet. The phase colours fill a node; the marks
       (WRITING.md) set its border, and some its fill and text. */
    --pele-bg: #ffffff;
    --pele-fg: #111418;
    --pele-muted: #565d68;
    --pele-line: #7c8592;
    --pele-surface: #f5f7f9;
    --pele-surface-alt: #eceff3;
    --pele-border: #aab2bd;
    --c-blue: #d6e6fb;
    --c-orange: #fbdcc6;
    --c-purple: #e3dcf7;
    --c-yellow: #f6e7a8;
    --c-teal: #cbeae2;
    --c-tan: #e9e1d6;
    --c-pink: #f8d6e6;
    --m-primary-line: #1d5fbf;
    --m-success-fill: #e7f4e9;
    --m-success-line: #2e8540;
    --m-success-text: #1e6a2f;
    --m-warning-fill: #fff3e2;
    --m-warning-line: #d9730d;
    --m-warning-text: #9a4a06;
    --m-danger-fill: #fdecec;
    --m-danger-line: #d0343c;
    --m-danger-text: #ad1f28;
    --m-muted-line: #98a0ab;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111317;
    --surface: #181b20;
    --surface-alt: #22262c;
    --ink: #eceef1;
    --muted: #a3aab4;
    --hairline: #262a31;
    --border: #353a43;
    --accent: #78a6ee;
    --accent-soft: #1d2a3d;

    --warn: #f3a95f;
    --warn-line: #d77a1c;
    --warn-soft: #2a2117;
    --open: #b9a4f2;
    --open-line: #8f74e0;
    --open-soft: #241f36;
    --note: #7fcf8b;
    --note-line: #3fa556;
    --note-soft: #172a1c;

    --pele-bg: #181b20;
    --pele-fg: #eceef1;
    --pele-muted: #a3aab4;
    --pele-line: #858e9b;
    --pele-surface: #20242a;
    --pele-surface-alt: #2a2f36;
    --pele-border: #4f5662;
    --c-blue: #1f3a5e;
    --c-orange: #553420;
    --c-purple: #392f5c;
    --c-yellow: #4f4518;
    --c-teal: #1a4740;
    --c-tan: #3e352c;
    --c-pink: #542842;
    --m-primary-line: #78a6ee;
    --m-success-fill: #17301f;
    --m-success-line: #3fa556;
    --m-success-text: #7fcf8b;
    --m-warning-fill: #302518;
    --m-warning-line: #d77a1c;
    --m-warning-text: #f3a95f;
    --m-danger-fill: #331d20;
    --m-danger-line: #d9474f;
    --m-danger-text: #ff8a8f;
    --m-muted-line: #6b7380;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  html { scroll-padding-top: calc(var(--bar-height) + 1.5rem); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.75 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: var(--accent-soft); }

  /* The bar and the layout share two edges. Layout: 14rem contents panel + 3rem gap + 54rem page = 71rem.
     The figure canvas inside the page column: 864 - 2 (edge) - 40 (padding) = 822px, the width page.py checks
     against. Below 1200px the panel leaves the grid and the page column takes the whole width. */
  .wrap { max-width: calc(71rem + 4rem); margin: 0 auto; padding: 0 2rem; }
  .layout { display: grid; grid-template-columns: 14rem minmax(0, 54rem); gap: 3rem; align-items: start; }
  .page { min-width: 0; }

  /* The top bar holds the product name, the date and project, and the theme switch. It stays on screen. */
  .bar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--hairline); }
  .bar .wrap { display: flex; align-items: center; gap: 1rem; height: var(--bar-height); }
  .brand { margin: 0; font-size: 0.875rem; font-weight: 600; line-height: 1; color: var(--ink); }
  .meta { margin: 0; color: var(--muted); font-size: 0.875rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .meta:empty { display: none; }
  .icon-button { display: grid; place-items: center; flex: none; width: 2.25rem; height: 2.25rem; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--muted); cursor: pointer; }
  .icon-button[hidden] { display: none; }
  .icon-button:hover, .icon-button[aria-expanded="true"] { color: var(--ink); border-color: var(--muted); }
  .icon-button:active { transform: translateY(1px); }
  .icon-button svg { width: 1.05rem; height: 1.05rem; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .theme-toggle { margin-left: auto; }
  /* The contents button shows only when the panel is folded away (below 1200px). */
  .toc-open { display: none; }
  /* The button shows the theme it turns on: the moon in the light theme, the sun in the dark one. */
  .theme-toggle .icon-sun, :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  .masthead { padding: 3rem 0 2.5rem; }
  h1 { margin: 0; font-size: clamp(1.5rem, 1.25rem + 0.8vw, 1.875rem); line-height: 1.3; font-weight: 700; }
  .question { margin: 0.75rem 0 0; color: var(--muted); font-size: 1rem; line-height: 1.7; }
  .question::before { content: "\201C"; }
  .question::after { content: "\201D"; }
  :root:lang(zh) .question::before { content: "\300C"; }
  :root:lang(zh) .question::after { content: "\300D"; }

  /* The contents panel: a sheet that stays beside the page while it scrolls. The reader's place is the grey pill. */
  .toc { position: sticky; top: calc(var(--bar-height) + 1.5rem); margin-top: 3rem; max-height: calc(100vh - var(--bar-height) - 3rem); overflow: auto; padding: 0.75rem 0.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 0.875rem; }
  .toc:empty { display: none; }
  .toc-title { margin: 0.15rem 0.75rem 0.5rem; color: var(--muted); font-weight: 600; line-height: 1.4; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc ol ol { padding-left: 0.85rem; }
  .toc li { margin: 0; }
  .toc a { display: block; padding: 0.4rem 0.75rem; border-radius: 6px; color: var(--muted); text-decoration: none; line-height: 1.45; }
  .toc a:hover { color: var(--ink); background: var(--surface-alt); }
  .toc a[aria-current] { color: var(--ink); background: var(--surface-alt); font-weight: 600; }
  .toc-backdrop { position: fixed; inset: 0; z-index: 25; background: rgba(10, 12, 16, 0.28); }
  .toc-backdrop[hidden] { display: none; }
  @media (prefers-reduced-motion: no-preference) { .toc a { transition: background-color 0.15s ease, color 0.15s ease; } }

  main { min-width: 0; padding-bottom: 6rem; counter-reset: figure; }
  section { margin: 0 0 4rem; }
  section:last-child { margin-bottom: 0; }
  h2 { margin: 0 0 1rem; font-size: 1.375rem; line-height: 1.4; font-weight: 700; }
  h3 { margin: 2.5rem 0 0.75rem; font-size: 1.125rem; line-height: 1.5; font-weight: 650; }
  h2 + h3 { margin-top: 0; }
  strong { font-weight: 650; }
  a { color: var(--accent); text-underline-offset: 0.2em; }

  /* Prose. A line of text stops at 46rem, so it stays readable; sheets (figures, tables, cards) take the column. */
  p { margin: 0 0 1rem; }
  main p, main ul:not(.legend), main ol:not(.steps) { max-width: 46rem; }
  .lede { font-size: 1.0625rem; }
  main ul:not(.legend), main ol:not(.steps) { margin: 0 0 1rem; padding-left: 1.4rem; }
  main li { margin: 0.3rem 0; }
  main li::marker { color: var(--muted); }

  code { font: 0.875em/1.5 var(--mono); background: var(--surface-alt); border-radius: 4px; padding: 0.1em 0.35em; margin: 0 0.1em; }
  /* A code reference copies its path when clicked. */
  code.ref { cursor: copy; color: var(--accent); background: var(--accent-soft); }
  code.ref.copied { color: var(--note); background: var(--note-soft); }
  pre { margin: 0 0 1.25rem; padding: 1rem 1.25rem; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  pre code { background: none; padding: 0; margin: 0; font-size: 0.85rem; }

  /* Key concepts: a grid of cards. */
  .concepts { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 0.75rem; margin: 0 0 1.5rem; }
  .concepts > div { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem 1.1rem; }
  .concepts dt { margin: 0 0 0.3rem; font-weight: 650; line-height: 1.5; }
  .concepts dt code { font-size: 0.78em; }
  .concepts dd { margin: 0; color: var(--muted); font-size: 0.9375rem; line-height: 1.65; }

  /* A numbered walk through a diagram or a code path. */
  ol.steps { counter-reset: step; list-style: none; margin: 0 0 1.25rem; padding: 0; max-width: 46rem; }
  ol.steps > li { counter-increment: step; position: relative; margin: 0; padding: 0 0 1.1rem 2.6rem; }
  ol.steps > li::before { content: counter(step); position: absolute; left: 0; top: 0.15rem; width: 1.65rem; height: 1.65rem; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 700 0.8125rem/1.65rem var(--sans); text-align: center; font-variant-numeric: tabular-nums; }
  ol.steps > li:not(:last-child)::after { content: ""; position: absolute; left: 0.8rem; top: 2.05rem; bottom: 0.25rem; width: 1px; background: var(--border); }

  /* A table is a sheet: a 1px edge, a header row one step off the sheet. */
  table { width: 100%; margin: 0 0 1.5rem; border-collapse: separate; border-spacing: 0; font-size: 0.9375rem; line-height: 1.6; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; vertical-align: top; padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--hairline); }
  th { background: var(--surface-alt); color: var(--ink); font-weight: 650; }
  tr:last-child > td { border-bottom: none; }
  td:first-child { white-space: nowrap; }

  .callout { max-width: 46rem; margin: 0 0 1rem; padding: 0.85rem 1.1rem; border: 1px solid var(--border); border-left-width: 3px; border-radius: 8px; background: var(--surface); }
  .callout > :last-child { margin-bottom: 0; }
  .callout > strong:first-child { display: block; margin-bottom: 0.25rem; }
  .callout.warn { background: var(--warn-soft); border-left-color: var(--warn-line); }
  .callout.warn > strong:first-child { color: var(--warn); }
  .callout.open { background: var(--open-soft); border-left-color: var(--open-line); }
  .callout.open > strong:first-child { color: var(--open); }
  .callout.note { background: var(--note-soft); border-left-color: var(--note-line); }
  .callout.note > strong:first-child { color: var(--note); }

  details { margin: 0 0 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  summary { cursor: pointer; padding: 0.7rem 1.1rem; font-weight: 600; }
  details > :not(summary) { margin-left: 1.1rem; margin-right: 1.1rem; }
  details[open] > summary { border-bottom: 1px solid var(--hairline); margin-bottom: 0.9rem; }

  /* The legend sits right above its figure (WRITING.md). Joined to it, the two read as one sheet:
     the legend is the sheet's header row, the caption its footer. */
  ul.legend { list-style: none; margin: 1.5rem 0 0.75rem; padding: 0; display: flex; flex-wrap: wrap; gap: 0.35rem 1.4rem; color: var(--ink); font-size: 0.875rem; line-height: 1.6; }
  ul.legend:has(+ figure.diagram) { margin-bottom: 0; padding: 0.85rem 1.25rem; background: var(--surface); border: 1px solid var(--border); border-bottom-color: var(--hairline); border-radius: 8px 8px 0 0; }
  ul.legend + figure.diagram { margin-top: 0; border-top: none; border-top-left-radius: 0; border-top-right-radius: 0; }
  ul.legend li { display: flex; gap: 0.5rem; align-items: center; margin: 0; }
  .swatch { flex: none; display: inline-block; width: 1.1rem; height: 0.8rem; border-radius: 3px; border: 1px solid var(--pele-border); background: var(--pele-surface); }
  .swatch.blue { background: var(--c-blue); }
  .swatch.orange { background: var(--c-orange); }
  .swatch.purple { background: var(--c-purple); }
  .swatch.yellow { background: var(--c-yellow); }
  .swatch.teal { background: var(--c-teal); }
  .swatch.tan { background: var(--c-tan); }
  .swatch.pink { background: var(--c-pink); }
  .swatch.primary { border: 2px solid var(--m-primary-line); }
  .swatch.success { border: 2px solid var(--m-success-line); background: var(--m-success-fill); }
  .swatch.warning { border: 2px solid var(--m-warning-line); background: var(--m-warning-fill); }
  .swatch.danger { border: 2px solid var(--m-danger-line); background: var(--m-danger-fill); }
  .swatch.muted { border: 1.5px dashed var(--m-muted-line); background: transparent; }
  /* Line styles: --> solid, -.-> dotted, ==> thick. */
  .swatch.solid, .swatch.dotted, .swatch.thick { width: 1.6rem; height: 0; border: none; border-radius: 0; background: none; }
  .swatch.solid { border-top: 2px solid var(--pele-line); }
  .swatch.dotted { border-top: 2px dashed var(--pele-line); }
  .swatch.thick { border-top: 4px solid var(--pele-line); }
  /* An item with no swatch, such as what a shape means, takes the whole row. */
  ul.legend li:not(:has(.swatch)) { flex-basis: 100%; color: var(--muted); }

  figure.diagram { counter-increment: figure; margin: 1.5rem 0 1.75rem; background: var(--pele-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .dg-canvas { position: relative; padding: 2rem 1.25rem; text-align: center; overflow: auto; background: var(--pele-bg); }
  figcaption { display: flex; gap: 0.75rem; align-items: baseline; padding: 0.75rem 1.25rem; border-top: 1px solid var(--hairline); background: var(--surface); color: var(--muted); font-size: 0.875rem; line-height: 1.6; }
  figcaption::before { flex: none; content: "Figure " counter(figure); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  :root:lang(zh) figcaption::before { content: "圖 " counter(figure); }
  .dg-error { margin: 0; padding: 0.8rem 1rem; border-radius: 6px; background: var(--m-danger-fill); color: var(--m-danger-text); font: 0.85rem/1.6 var(--mono); white-space: pre-wrap; text-align: left; }

  /* Pele reads the --pele-* variables from :root, so a theme change needs no redraw. */
  .pele {
    --pele-accent: var(--m-primary-line);
    --pele-critical: var(--m-danger-line);
    --pele-error: var(--m-danger-line);
    --pele-font: var(--sans);
    --pele-font-mono: var(--mono);
    --pele-radius: 6px;
  }
  /* Phase colors: "class a,b teal". page.py refuses classDef and style, so these rules alone color the nodes. */
  .pele .pele-node.blue > :not(text) { fill: var(--c-blue); }
  .pele .pele-node.orange > :not(text) { fill: var(--c-orange); }
  .pele .pele-node.purple > :not(text) { fill: var(--c-purple); }
  .pele .pele-node.yellow > :not(text) { fill: var(--c-yellow); }
  .pele .pele-node.teal > :not(text) { fill: var(--c-teal); }
  .pele .pele-node.tan > :not(text) { fill: var(--c-tan); }
  .pele .pele-node.pink > :not(text) { fill: var(--c-pink); }
  /* Marks: "class c danger". They come after the phase colors, so a mark shows over a phase color. */
  .pele .pele-node.primary > :not(text) { stroke: var(--m-primary-line); stroke-width: 2.5px; }
  .pele .pele-node.success > :not(text) { fill: var(--m-success-fill); stroke: var(--m-success-line); stroke-width: 2px; }
  .pele .pele-node.success text { fill: var(--m-success-text); }
  .pele .pele-node.warning > :not(text) { fill: var(--m-warning-fill); stroke: var(--m-warning-line); stroke-width: 2px; }
  .pele .pele-node.warning text { fill: var(--m-warning-text); }
  .pele .pele-node.danger > :not(text) { fill: var(--m-danger-fill); stroke: var(--m-danger-line); stroke-width: 2px; }
  .pele .pele-node.danger text { fill: var(--m-danger-text); }
  .pele .pele-node.muted > :not(text) { fill: var(--pele-bg); stroke: var(--m-muted-line); stroke-dasharray: 6 3; }
  .pele .pele-node.muted text { fill: var(--pele-muted); }
  /* Pele colours mindmap branches and timeline periods by their order (--pele-series-1 to 8), so the colour
     means nothing there. One neutral for all of them. */
  .pele-mindmap, .pele-timeline {
    --pele-series-1: var(--pele-line); --pele-series-2: var(--pele-line);
    --pele-series-3: var(--pele-line); --pele-series-4: var(--pele-line);
    --pele-series-5: var(--pele-line); --pele-series-6: var(--pele-line);
    --pele-series-7: var(--pele-line); --pele-series-8: var(--pele-line);
  }

  /* Below 1200px the panel folds away. The contents button in the bar slides it in over the page. */
  @media (max-width: 1199px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .toc-open { display: grid; }
    .toc-open[hidden] { display: none; }
    .toc { position: fixed; z-index: 30; top: calc(var(--bar-height) + 0.5rem); left: 0.75rem; width: min(18rem, calc(100vw - 1.5rem)); max-height: calc(100vh - var(--bar-height) - 1.25rem); margin: 0; box-shadow: 0 16px 40px -16px rgba(10, 12, 16, 0.45); visibility: hidden; opacity: 0; transform: translateX(-0.75rem); }
    .toc.open { visibility: visible; opacity: 1; transform: none; }
  }
  @media (max-width: 1199px) and (prefers-reduced-motion: no-preference) {
    .toc { transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s linear 0.18s; }
    .toc.open { transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s; }
  }
  @media (max-width: 960px) {
    .wrap { padding: 0 1.25rem; }
    .masthead { padding: 2rem 0 1.5rem; }
    main { padding-bottom: 4rem; }
    section { margin-bottom: 3rem; }
  }
  @media (max-width: 560px) {
    .meta { display: none; }
    .dg-canvas { padding: 1.5rem 0.75rem; }
    ul.legend:has(+ figure.diagram), figcaption { padding-left: 1rem; padding-right: 1rem; }
    td:first-child { white-space: normal; }
  }
  @media print {
    .bar, .toc, .toc-backdrop { display: none; }
    .layout { display: block; }
    body { background: #fff; }
    .masthead { padding-top: 0; }
    figure.diagram, table, .callout, details, .concepts > div { break-inside: avoid; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <button class="icon-button toc-open" type="button" aria-controls="toc" aria-expanded="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <p class="brand">mreq how</p>
    <p class="meta">{{META}}</p>
    <button class="icon-button theme-toggle" type="button" role="switch" aria-checked="false" hidden>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</header>
<div class="wrap layout">
  <nav class="toc" id="toc" aria-label="Contents"></nav>
  <div class="page">
    <div class="masthead">
      <h1>{{TITLE}}</h1>
      <p class="question">{{QUESTION}}</p>
    </div>
    <main>
<!-- CONTENT -->
    </main>
  </div>
</div>
<div class="toc-backdrop" hidden></div>
<script>{{PELE}}</script>
<script>
(function () {
  'use strict';
  var ZH = /^zh/i.test(document.documentElement.lang || '');
  var T = ZH
    ? { contents: '目錄', zoomIn: '放大', zoomOut: '縮小', reset: '還原大小', missing: '繪圖程式沒有載入, 所以畫不出這張圖.',
        dark: '深色模式', copied: '已複製' }
    : { contents: 'Contents', zoomIn: 'Zoom in', zoomOut: 'Zoom out', reset: 'Reset zoom', missing: 'This diagram cannot be drawn: the drawing library did not load.',
        dark: 'Dark theme', copied: 'Copied' };
  // check.mjs passes the same limits: Pele's defaults are smaller than a large diagram can be.
  var LIMITS = { limit: 1000000, outputLimit: 8000000, maxEdges: 10000 };

  function themeToggle() {
    var button = document.querySelector('.theme-toggle');
    var root = document.documentElement;
    // A switch keeps one name; aria-checked says whether the dark theme is on.
    function sync() { button.setAttribute('aria-checked', root.dataset.theme === 'dark' ? 'true' : 'false'); }
    button.setAttribute('aria-label', T.dark);
    button.title = T.dark;
    button.addEventListener('click', function () {
      if (root.dataset.theme === 'dark') delete root.dataset.theme;
      else root.dataset.theme = 'dark';
      sync();
    });
    sync();
    button.hidden = false;
  }

  // The contents panel: each section's h2, and the h3 inside it one level down.
  function buildToc() {
    var toc = document.getElementById('toc');
    var opener = document.querySelector('.toc-open');
    var backdrop = document.querySelector('.toc-backdrop');
    var root = document.documentElement;
    var entries = [];
    var list = document.createElement('ol');

    function entry(heading, target, parentList) {
      var item = document.createElement('li');
      var link = document.createElement('a');
      link.href = '#' + target.id;
      link.textContent = heading.textContent;
      item.appendChild(link);
      parentList.appendChild(item);
      entries.push({ link: link, target: target });
      return item;
    }

    document.querySelectorAll('main section').forEach(function (section, index) {
      var h2 = section.querySelector('h2');
      if (!h2) return;
      if (!section.id) section.id = 'section-' + (index + 1);
      var item = entry(h2, section, list);
      var subs = section.querySelectorAll('h3');
      if (!subs.length) return;
      var sublist = document.createElement('ol');
      subs.forEach(function (h3, subIndex) {
        if (!h3.id) h3.id = section.id + '-' + (subIndex + 1);
        entry(h3, h3, sublist);
      });
      item.appendChild(sublist);
    });
    if (!entries.length) { toc.remove(); backdrop.remove(); return; }

    var title = document.createElement('p');
    title.className = 'toc-title';
    title.textContent = T.contents;
    toc.setAttribute('aria-label', T.contents);
    toc.appendChild(title);
    toc.appendChild(list);

    // The entry whose target has passed just under the top bar is the one being read.
    function mark() {
      var line = (parseFloat(getComputedStyle(root).scrollPaddingTop) || 76) + 48;
      var current = entries[0];
      entries.forEach(function (e) { if (e.target.getBoundingClientRect().top < line) current = e; });
      entries.forEach(function (e) {
        if (e === current) e.link.setAttribute('aria-current', 'location');
        else e.link.removeAttribute('aria-current');
      });
    }
    window.addEventListener('scroll', mark, { passive: true });
    mark();

    // Below 1200px the panel is folded away; the contents button opens it over the page.
    var narrow = window.matchMedia('(max-width: 1199px)');
    function setOpen(open, returnFocus) {
      toc.classList.toggle('open', open);
      backdrop.hidden = !open;
      opener.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) (toc.querySelector('a[aria-current]') || toc.querySelector('a')).focus();
      else if (returnFocus) opener.focus();
    }
    opener.setAttribute('aria-label', T.contents);
    opener.title = T.contents;
    opener.addEventListener('click', function () { setOpen(!toc.classList.contains('open'), false); });
    backdrop.addEventListener('click', function () { setOpen(false, true); });
    toc.addEventListener('click', function (event) {
      if (event.target.closest('a') && narrow.matches) setOpen(false, false);
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && toc.classList.contains('open')) setOpen(false, true);
    });
    narrow.addEventListener('change', function () { setOpen(false, false); });
    opener.hidden = false;
  }

  function showError(canvas, text) {
    var box = document.createElement('pre');
    box.className = 'dg-error';
    box.textContent = text;
    canvas.appendChild(box);
  }

  function drawDiagrams() {
    var font = getComputedStyle(document.body).fontFamily;
    document.querySelectorAll('figure.diagram').forEach(function (figure) {
      var spec = figure.querySelector('script[type="text/x-mermaid"]');
      if (!spec) return;
      var source = spec.textContent.replace(/^\s*\n/, '').replace(/\s+$/, '');
      var canvas = document.createElement('div');
      canvas.className = 'dg-canvas';
      spec.after(canvas);

      if (typeof pele === 'undefined') { showError(canvas, T.missing); return; }
      // mount() draws the error in the canvas itself and redraws when the width changes.
      pele.mount(canvas, source, {
        fontFamily: font,
        limit: LIMITS.limit,
        outputLimit: LIMITS.outputLimit,
        maxEdges: LIMITS.maxEdges,
        zoom: { labels: { zoomIn: T.zoomIn, zoomOut: T.zoomOut, reset: T.reset } }
      });
    });
  }

  // A code reference (code.ref) copies its text when clicked.
  function copyRefs() {
    function copy(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      var area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      try { document.execCommand('copy'); } finally { area.remove(); }
      return Promise.resolve();
    }
    document.addEventListener('click', function (event) {
      var ref = event.target.closest('code.ref');
      if (!ref) return;
      copy(ref.textContent).then(function () {
        ref.classList.add('copied');
        ref.title = T.copied;
        setTimeout(function () { ref.classList.remove('copied'); ref.removeAttribute('title'); }, 1200);
      });
    });
  }

  themeToggle();
  buildToc();
  drawDiagrams();
  copyRefs();
})();
</script>
</body>
</html>
